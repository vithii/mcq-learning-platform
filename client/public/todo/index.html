<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Tickle Tasks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#EAF0FF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app — greeting + progress ring, view tabs, list filters, task cards, floating add button opening a bottom sheet. */
:root {
  --bg: #EAF0FF;
  --surface: #FFFFFF;
  --ink: #16213D;
  --muted: #5E6A88;
  --line: #D5DEF3;
  --accent: #2F5BFF;
  --accent-ink: #FFFFFF;
  --sun: #FFCE3A;
  --danger: #E5484D;
  --l-personal: #FF5FA2;
  --l-work: #2F5BFF;
  --l-home: #F59E0B;
  --l-errands: #16A673;
  --shadow: 0 1px 2px rgba(22,33,61,.06), 0 6px 18px rgba(47,91,255,.08);
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1424; --surface: #1A2136; --ink: #EEF2FF; --muted: #9AA5C4; --line: #2A3352;
    --accent: #6F8CFF; --accent-ink: #0F1424; --sun: #FFD75E; --danger: #FF6B6F;
    --l-personal: #FF7DB4; --l-work: #7B96FF; --l-home: #FBB43C; --l-errands: #34C98F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1424; --surface: #1A2136; --ink: #EEF2FF; --muted: #9AA5C4; --line: #2A3352;
  --accent: #6F8CFF; --accent-ink: #0F1424; --sun: #FFD75E; --danger: #FF6B6F;
  --l-personal: #FF7DB4; --l-work: #7B96FF; --l-home: #FBB43C; --l-errands: #34C98F;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
.app {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 120px;
  display: flex; flex-direction: column; gap: 18px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Header */
.hero { display: flex; align-items: center; gap: 16px; }
.hero-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.date { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 8vw, 38px); line-height: 1.02; letter-spacing: -.02em; text-wrap: balance; }
.cheer { margin: 0; color: var(--muted); font-size: 15px; }
.ring { position: relative; width: 88px; height: 88px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { fill: none; stroke: var(--line); stroke-width: 10; }
.ring .bar { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .6s cubic-bezier(.3,1.4,.5,1); }
.ring .num { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; }
.ring .num small { display: block; font-family: var(--font-body); font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 3px; letter-spacing: .04em; }
.ring.full .bar { stroke: var(--l-errands); }

/* Tabs */
.mode { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--line); }
.mode button { border: 0; background: none; border-radius: 10px; padding: 8px; font-weight: 700; font-size: 14px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; }
.mode svg { width: 17px; height: 17px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.mode button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.cal { display: flex; flex-direction: column; gap: 12px; }
.cal-card { background: var(--surface); border-radius: 20px; padding: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; }
.cal-head { display: flex; align-items: center; gap: 6px; padding-bottom: 4px; }
.cal-head strong { flex: 1; min-width: 0; font-family: var(--font-display); font-weight: 800; font-size: 18px; padding-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-nav { border: 0; background: var(--bg); width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; }
.cal-nav svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.cal-today { border: 1.5px solid var(--line); background: none; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 700; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.cal-dow span { text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 2px 0; }
.cell { border: 0; background: none; border-radius: 12px; min-width: 0; padding: 4px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--ink); }
.cell.out { color: var(--muted); opacity: .45; }
.cell .n { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; }
.cell.today .n { box-shadow: inset 0 0 0 2px var(--accent); color: var(--accent); }
.cell[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.cell[aria-pressed="true"] .n { box-shadow: none; color: var(--accent-ink); }
.cell .dots { display: flex; gap: 2px; align-items: center; height: 6px; }
.cell .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.cell .dots i.done { opacity: .35; }
.cell .dots i.late { box-shadow: 0 0 0 1.5px var(--danger); }
.cell .dots b { font-size: 9px; line-height: 1; color: var(--muted); }
.cell[aria-pressed="true"] .dots i { box-shadow: 0 0 0 1.5px var(--accent-ink); }
.cell[aria-pressed="true"] .dots b { color: var(--accent-ink); }
.cal-day-head { display: flex; align-items: center; gap: 10px; padding: 4px 4px 0; }
.cal-day-head h2 { flex: 1; min-width: 0; margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 19px; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 4px; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); }
.tab { border: 0; background: none; padding: 9px 2px; border-radius: 12px; font-weight: 700; font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 5px; }
.tab .count { font-size: 12px; min-width: 20px; padding: 1px 6px; border-radius: 999px; background: var(--bg); font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.tab[aria-selected="true"] .count { background: var(--sun); color: #16213D; }

/* Filters */
.filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; padding: 2px 4px; }
.filters::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1.5px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--muted)); }
.chip[aria-pressed="true"] { border-color: var(--c, var(--ink)); color: var(--ink); background: var(--surface); }

/* Tasks */
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.group-label { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 8px 4px 0; }
.task { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 18px; padding: 12px 8px 12px 14px; box-shadow: var(--shadow); animation: pop-in .28s ease-out; }
.task.leaving { animation: slide-out .35s ease-in forwards; }
.check { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--c); background: transparent; display: grid; place-items: center; padding: 0; transition: transform .15s; }
.check svg { width: 16px; height: 16px; stroke: var(--accent-ink); stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.check:active { transform: scale(.88); }
.task.done .check { background: var(--c); animation: boing .4s ease-out; }
.task.done .check svg { opacity: 1; }
.body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.title { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.task.done .title { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: var(--c); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 13px; color: var(--muted); }
.meta .lst { display: inline-flex; align-items: center; gap: 5px; }
.meta .lst::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.meta .due.today { color: var(--accent); font-weight: 700; }
.meta .due.late { color: var(--danger); font-weight: 700; }
.meta .repeat { display: inline-flex; align-items: center; gap: 4px; }
.meta .repeat::before { content: "↻"; font-weight: 700; color: var(--c); }
.meta .streak { font-weight: 700; background: var(--sun); color: #16213D; border-radius: 999px; padding: 0 8px; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.seg button { border: 2px solid var(--line); background: var(--bg); border-radius: 14px; padding: 9px 10px; min-width: 0; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.seg strong { font-size: 15px; }
.seg span { font-size: 12px; color: var(--muted); }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.del { flex: none; border: 0; background: none; width: 40px; height: 40px; border-radius: 12px; color: var(--muted); display: grid; place-items: center; }
.del svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; }
.del.armed { background: var(--danger); color: #fff; width: auto; padding: 0 10px; font-size: 13px; font-weight: 700; }

.empty { text-align: center; padding: 36px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--muted); }
.empty .blob { width: 84px; height: 84px; border-radius: 42% 58% 55% 45% / 50% 45% 55% 50%; background: var(--sun); display: grid; place-items: center; animation: wobble 4s ease-in-out infinite; }
.empty .blob svg { width: 40px; height: 40px; stroke: #16213D; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.empty h2 { margin: 6px 0 0; font-family: var(--font-display); font-weight: 800; font-size: 22px; color: var(--ink); }
.empty p { margin: 0; max-width: 30ch; }
.ideas { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px; }

.clear { align-self: center; border: 1.5px dashed var(--line); background: none; border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 14px; color: var(--muted); }
.clear.armed { border-style: solid; border-color: var(--danger); color: var(--danger); }
.sync { font-size: 12px; color: var(--muted); text-align: center; }
.plan { display: flex; align-items: center; gap: 12px; background: var(--sun); color: #16213D; border-radius: 18px; padding: 12px 8px 12px 16px; animation: pop-in .3s ease-out; }
.plan-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.plan-text strong { font-family: var(--font-display); font-weight: 800; font-size: 17px; }
.plan-text span { font-size: 14px; }
.plan-go { flex: none; border: 0; background: #16213D; color: #FFCE3A; border-radius: 12px; padding: 10px 14px; font-weight: 800; font-size: 14px; }
.plan-x { flex: none; border: 0; background: none; color: #16213D; width: 32px; height: 32px; border-radius: 10px; font-size: 20px; line-height: 1; }

/* FAB + sheet */
.fab { position: fixed; z-index: 20; right: max(20px, calc(env(safe-area-inset-right, 0px) + 16px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); width: 64px; height: 64px; border-radius: 22px; border: 0; background: var(--accent); color: var(--accent-ink); box-shadow: 0 10px 24px rgba(47,91,255,.4); display: grid; place-items: center; transition: transform .15s; }
.fab:active { transform: scale(.92) rotate(-8deg); }
.fab svg { width: 30px; height: 30px; stroke: currentColor; stroke-width: 3; stroke-linecap: round; }
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(10,15,30,.4); animation: fade .2s; }
.sheet { position: fixed; z-index: 31; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 24px 24px 0 0; padding-top: 10px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); animation: rise .25s cubic-bezier(.2,1.2,.4,1); }
.sheet-inner { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; }
.sheet h3 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 22px; }
#newTitle { width: 100%; border: 2px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 14px; padding: 14px; font: inherit; font-size: 17px; }
#newTitle:focus { border-color: var(--accent); outline: none; }
.field-label { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.day { border: 2px solid var(--line); background: var(--bg); border-radius: 12px; padding: 7px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; }
.day .dname { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.day .dnum { font-family: var(--font-display); font-weight: 800; font-size: 20px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.day .dmon { font-size: 10px; font-weight: 600; color: var(--muted); }
.day.is-today { border-color: var(--accent); }
.day.is-today .dmon { color: var(--accent); font-weight: 800; }
.day[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.day[aria-pressed="true"] .dname, .day[aria-pressed="true"] .dmon { color: var(--accent-ink); }
.ddots { display: flex; gap: 2px; height: 5px; margin-top: 2px; }
.ddots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.day[aria-pressed="true"] .ddots i { background: var(--accent-ink); }
.sheet { max-height: calc(100% - 24px); overflow-y: auto; }
.step-of { margin: -8px 0 0; color: var(--muted); font-weight: 600; }
.step-of b { color: var(--ink); }
.steps { display: flex; flex-direction: column; gap: 8px; }
.step-row { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto 30px; gap: 8px; align-items: center; }
.step-n { font-weight: 800; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.step-name { min-width: 0; width: 100%; border: 2px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px; padding: 10px; font: inherit; font-size: 15px; }
.step-name:focus { border-color: var(--accent); outline: none; }
.step-x { border: 0; background: none; color: var(--muted); font-size: 22px; line-height: 1; padding: 0; }
.add-step { align-self: flex-start; border-style: dashed; }
.meta .proj { font-weight: 700; color: var(--ink); }
.project { background: var(--surface); border-radius: 20px; padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; animation: pop-in .28s ease-out; }
.p-head { display: flex; gap: 10px; align-items: flex-start; }
.p-head > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.p-title { font-family: var(--font-display); font-weight: 800; font-size: 21px; line-height: 1.15; overflow-wrap: anywhere; }
.p-sub { font-size: 13px; color: var(--muted); }
.p-sub.complete { color: var(--l-errands); font-weight: 800; }
.p-bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.p-bar span { display: block; height: 100%; background: var(--c); border-radius: inherit; transition: width .5s; }
.p-steps .task { box-shadow: none; background: var(--bg); animation: none; }
.p-del { flex: none; border: 0; background: none; color: var(--muted); padding: 6px 8px; border-radius: 10px; font-size: 13px; font-weight: 700; }
.p-del.armed { background: var(--danger); color: #fff; }
.date-chip { position: relative; }
.date-chip input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
.add-btn { border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 17px; padding: 15px; }
.add-btn:disabled { opacity: .45; }

.toast { position: fixed; z-index: 40; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 100px); transform: translateX(-50%); background: var(--ink); color: var(--bg); border-radius: 14px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 15px; box-shadow: var(--shadow); width: max-content; max-width: calc(100% - 32px); animation: rise .25s ease-out; }
.toast button { border: 0; background: var(--sun); color: #16213D; border-radius: 10px; padding: 6px 12px; font-weight: 700; font-size: 14px; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

@keyframes pop-in { from { transform: scale(.96); opacity: .3; } }
@keyframes slide-out { to { transform: translateX(40px); opacity: 0; } }
@keyframes boing { 0% { transform: scale(.7); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
@keyframes rise { from { transform: translate(var(--tx, 0), 30px); opacity: 0; } }
.toast { --tx: -50%; }
@keyframes fade { from { opacity: 0; } }
@keyframes wobble { 50% { border-radius: 55% 45% 42% 58% / 45% 55% 50% 50%; transform: rotate(6deg); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<main class="app">
  <header class="hero">
    <div class="hero-text">
      <span class="date" id="today"></span>
      <h1 id="greet">Let's get going</h1>
      <p class="cheer" id="cheer"></p>
    </div>
    <div class="ring" id="ring" role="img" aria-label="Progress">
      <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="42"></circle><circle class="bar" id="ringBar" cx="50" cy="50" r="42" stroke-dasharray="263.9" stroke-dashoffset="263.9"></circle></svg>
      <div class="num"><span id="ringNum">0/0</span><small>today</small></div>
    </div>
  </header>

  <div class="mode" role="group" aria-label="Layout">
    <button type="button" data-mode="list" id="mode-list"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>List</button>
    <button type="button" data-mode="cal" id="mode-cal"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendar</button>
  </div>

  <nav class="tabs" role="tablist" aria-label="Views">
    <button class="tab" role="tab" data-view="todo" id="tab-todo">To do <span class="count" id="c-todo">0</span></button>
    <button class="tab" role="tab" data-view="today" id="tab-today">Today <span class="count" id="c-today">0</span></button>
    <button class="tab" role="tab" data-view="projects" id="tab-projects">Projects <span class="count" id="c-projects">0</span></button>
    <button class="tab" role="tab" data-view="done" id="tab-done">Done <span class="count" id="c-done">0</span></button>
  </nav>

  <div class="plan" id="plan" hidden>
    <div class="plan-text"><strong id="planTitle"></strong><span id="planBody"></span></div>
    <button class="plan-go" id="planGo">Add tasks</button>
    <button class="plan-x" id="planX" aria-label="Hide for today">×</button>
  </div>

  <div class="filters" id="filters" aria-label="Filter by list"></div>

  <ul class="list" id="list"></ul>

  <section class="cal" id="cal" hidden aria-label="Calendar">
    <div class="cal-card">
      <div class="cal-head">
        <button type="button" class="cal-nav" id="calPrev" aria-label="Previous month"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <strong id="calTitle"></strong>
        <button type="button" class="cal-today" id="calToday">Today</button>
        <button type="button" class="cal-nav" id="calNext" aria-label="Next month"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div class="cal-grid cal-dow" id="calDow"></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
    <div class="cal-day-head"><h2 id="calDayTitle"></h2><button type="button" class="chip add-step" id="calAdd">+ Add</button></div>
    <ul class="list" id="dayList"></ul>
  </section>

  <p class="sync" id="sync"></p>
</main>

<button class="fab" id="fab" aria-label="Add a task"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg></button>

<div id="sheetWrap" hidden>
  <div class="scrim" id="scrim"></div>
  <form class="sheet" id="sheet" aria-label="New task">
    <div class="sheet-inner">
      <div class="grab"></div>
      <h3 id="sheetTitle">New task</h3>
      <p class="step-of" id="stepOf" hidden></p>
      <input id="newTitle" type="text" placeholder="What needs doing?" autocomplete="off" maxlength="140" enterkeyhint="done">
      <div class="seg" id="pickType" role="group" aria-label="Task type">
        <button type="button" data-type="once"><strong>One-time</strong><span>Tick once, done</span></button>
        <button type="button" data-type="daily"><strong>Every day</strong><span>Comes back daily</span></button>
        <button type="button" data-type="project"><strong>Project</strong><span>Big goal, steps</span></button>
      </div>
      <span class="field-label" id="listLabel">List</span>
      <div class="row" id="pickList"></div>
      <span class="field-label" id="stepsLabel" hidden>Steps · one per day</span>
      <div class="steps" id="steps" hidden></div>
      <button type="button" class="chip add-step" id="addStepRow" hidden>+ Add another step</button>
      <span class="field-label" id="whenLabel">When</span>
      <div class="week" id="pickWeek" role="group" aria-label="Pick a day this week"></div>
      <div class="row" id="pickWhen">
        <button type="button" class="chip" data-when="none">No date</button>
        <button type="button" class="chip" data-when="month">This month</button>
        <span class="chip date-chip" id="pickDateChip"><span id="pickDateLabel">Pick a date</span><input id="pickDate" type="date" aria-label="Pick a date"></span>
      </div>
      <button class="add-btn" id="addBtn" type="submit" disabled>Add task</button>
    </div>
  </form>
</div>

<div id="toastWrap"></div>
<canvas id="confetti"></canvas>

<script>
(() => {
  const LISTS = [
    { id: "personal", name: "Personal", c: "var(--l-personal)" },
    { id: "work", name: "Work", c: "var(--l-work)" },
    { id: "home", name: "Home", c: "var(--l-home)" },
    { id: "errands", name: "Errands", c: "var(--l-errands)" },
  ];
  const listById = Object.fromEntries(LISTS.map(l => [l.id, l]));
  const CHEERS = ["Nice one!", "Boom. Done.", "Look at you go!", "Crushed it.", "One less thing!", "Smooth.", "On a roll!", "Tick!"];
  const IDEAS = [
    { t: "Brush teeth", r: "daily" }, { t: "Take a shower", r: "daily" }, { t: "Drink 8 glasses of water", r: "daily" },
    { t: "Reply to that email", r: "once" }, { t: "Plan this week", r: "once" },
  ];
  const LS_KEY = "tickle-tasks-v1";

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  let tasks = [];
  let projects = []; // big goals; their steps are one-time tasks with `parent` set to the project id
  let view = "todo";
  let filter = "all";
  let draft = { repeat: "once", list: "personal", when: "today", date: null, parent: null, steps: [] };
  let store = null; // db collection ref when shared storage is available
  let armedDelete = null, armedClear = false;
  const leaving = new Set();

  try { view = localStorage.getItem("tickle-view") || "todo"; } catch (e) {}
  if (view === "month") view = "todo";
  let mode = "list"; // "list" or "cal"
  try { mode = localStorage.getItem("tickle-mode") === "cal" ? "cal" : "list"; } catch (e) {}
  let selDate = ymd(new Date());
  let calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);

  // ---------- storage ----------
  function split(all) {
    projects = all.filter(x => x.kind === "project");
    tasks = all.filter(x => x.kind !== "project");
  }
  function loadLocal() {
    try { split(JSON.parse(localStorage.getItem(LS_KEY) || "[]")); } catch (e) { split([]); }
  }
  function saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(tasks.concat(projects))); } catch (e) {}
  }
  async function persist(task, removed) {
    if (store) {
      try {
        if (removed) await store.doc(task.id).delete();
        else { const { id, ...body } = task; await store.doc(id).set(body); }
      } catch (e) {
        showToast(e && e.code === "quota_exceeded" ? "Storage is full. Clear some done tasks." : "Couldn't save that change. Check your connection.");
      }
    } else saveLocal();
  }

  async function connectDb() {
    const c = window.claude;
    if (!c || !c.use) { setSync("Saved on this device"); return; }
    try {
      const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
      const id = user ? await user.id() : null;
      if (!db || !id) { setSync("Saved on this device"); return; }
      store = db.collection("data/users/" + id);
      let first = true;
      store.onSnapshot(snap => {
        const remote = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (first) {
          first = false;
          // Move anything saved on this device into your account the first time.
          const known = new Set(remote.map(t => t.id));
          const local = tasks.concat(projects).filter(t => !known.has(t.id));
          local.forEach(t => persist(t));
          split(remote.concat(local));
          if (local.length) { try { localStorage.removeItem(LS_KEY); } catch (e) {} }
        } else {
          split(remote);
        }
        setSync("Synced to your account · works on every device");
        render();
      }, () => { store = null; setSync("Saved on this device"); saveLocal(); });
    } catch (e) { setSync("Saved on this device"); }
  }
  function setSync(t) { $("sync").textContent = t; }

  // ---------- helpers ----------
  const todayStr = () => ymd(new Date());
  function dueInfo(due) {
    if (!due) return null;
    const t = todayStr();
    if (due < t) return { text: "Overdue · " + parseYmd(due).toLocaleDateString(undefined, { month: "short", day: "numeric" }), cls: "late" };
    if (due === t) return { text: "Today", cls: "today" };
    if (due === ymd(addDays(new Date(), 1))) return { text: "Tomorrow", cls: "" };
    const d = parseYmd(due), diff = (d - parseYmd(t)) / 864e5;
    if (due === endOfMonth() && diff >= 7) return { text: "This month", cls: "" };
    return { text: diff < 7 ? d.toLocaleDateString(undefined, { weekday: "long" }) : d.toLocaleDateString(undefined, { month: "short", day: "numeric" }), cls: "" };
  }
  function whenToDate(when) {
    const now = new Date();
    if (when === "today") return ymd(now);
    if (when === "tomorrow") return ymd(addDays(now, 1));
    if (when === "weekend") { const day = now.getDay(); return ymd(addDays(now, day === 6 || day === 0 ? 0 : 6 - day)); }
    if (when === "month") return endOfMonth();
    if (when === "date") return draft.date;
    return null;
  }
  function endOfMonth() { const n = new Date(); return ymd(new Date(n.getFullYear(), n.getMonth() + 1, 0)); }
  const isDaily = t => t.repeat === "daily";
  const doneNow = t => isDaily(t) ? (t.days || []).includes(todayStr()) : !!t.done;
  function streakOf(t) {
    const days = new Set(t.days || []);
    let d = new Date(), n = 0;
    if (!days.has(ymd(d))) d = addDays(d, -1);
    while (days.has(ymd(d))) { n++; d = addDays(d, -1); }
    return n;
  }
  const projectOf = t => t.parent ? projects.find(p => p.id === t.parent) : null;
  const stepsOf = p => tasks.filter(t => t.parent === p.id).sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999") || a.createdAt - b.createdAt);
  function dateHeading(due) {
    const d = parseYmd(due), label = d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "short" });
    if (due === todayStr()) return "Today · " + label;
    if (due === ymd(addDays(new Date(), 1))) return "Tomorrow · " + label;
    return label;
  }
  const isToday = t => isDaily(t) || (t.due && t.due <= todayStr());
  const isThisMonth = t => !isDaily(t) && t.due && t.due <= endOfMonth();

  // ---------- planning nudges ----------
  let planKind = null;
  function planDismissed(kind) { try { return localStorage.getItem("tickle-plan-" + kind) === todayStr(); } catch (e) { return false; } }
  function renderPlan() {
    const once = tasks.filter(x => !isDaily(x));
    const open = once.filter(x => !x.done);
    const todayCount = open.filter(isToday).length + once.filter(doneToday).length;
    const monthCount = open.filter(x => isThisMonth(x) && !isToday(x)).length;
    const hasDaily = tasks.some(isDaily);
    const dom = new Date().getDate();
    planKind = null;
    if (!todayCount && !planDismissed("today")) planKind = "today";
    else if ((dom <= 3 || !monthCount) && !planDismissed("month")) planKind = "month";
    $("plan").hidden = !planKind;
    if (planKind === "today") {
      $("planTitle").textContent = "Plan your day";
      $("planBody").textContent = hasDaily ? "Your daily tasks are set. What one-time tasks do you want to finish today?" : "Nothing is on today's list yet. What do you want to get done?";
    } else if (planKind === "month") {
      const m = new Date().toLocaleDateString(undefined, { month: "long" });
      $("planTitle").textContent = `Plan ${m}`;
      $("planBody").textContent = monthCount ? `${monthCount} task${monthCount === 1 ? "" : "s"} planned so far. Add the big things for this month.` : "Add the big things you want to finish this month.";
    }
  }
  const doneToday = t => isDaily(t) ? doneNow(t) : t.done && t.doneAt && ymd(new Date(t.doneAt)) === todayStr();

  // ---------- render ----------
  function render() {
    const t = todayStr();
    const now = new Date();
    $("today").textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    const h = now.getHours();
    $("greet").textContent = h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";

    const open = tasks.filter(x => !doneNow(x));
    const onceAll = tasks.filter(x => !isDaily(x));
    const onceOpen = onceAll.filter(x => !x.done);
    const doneCount = onceAll.length - onceOpen.length;
    const todayOpen = open.filter(isToday);
    const finishedToday = tasks.filter(doneToday);
    const total = todayOpen.length + finishedToday.length;
    const pct = total ? finishedToday.length / total : 0;
    $("ringBar").style.strokeDashoffset = String(263.9 * (1 - pct));
    $("ringNum").textContent = `${finishedToday.length}/${total}`;
    $("ring").classList.toggle("full", total > 0 && pct === 1);
    $("ring").setAttribute("aria-label", `${finishedToday.length} of ${total} tasks done today`);
    $("cheer").textContent =
      total === 0 ? (open.length ? "Nothing due today. Pick something fun." : "A clean slate. Add your first task.")
      : pct === 1 ? "Everything for today is done. Go celebrate!"
      : pct >= .5 ? `${todayOpen.length} to go. You're past halfway!`
      : `${todayOpen.length} thing${todayOpen.length === 1 ? "" : "s"} on today's plate.`;

    $("c-todo").textContent = open.length;
    $("c-today").textContent = todayOpen.length;
    $("c-projects").textContent = projects.length;
    renderPlan();
    $("c-done").textContent = doneCount;
    const clearable = onceAll.filter(x => x.done && !projectOf(x)).length;
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === view)));
    document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
    const cal = mode === "cal";
    document.querySelector(".tabs").hidden = $("list").hidden = cal;
    $("cal").hidden = !cal;

    // filters
    const f = $("filters");
    f.innerHTML = "";
    [{ id: "all", name: "All lists" }, ...LISTS].forEach(l => {
      const b = document.createElement("button");
      b.className = "chip"; b.dataset.filter = l.id;
      if (l.c) b.style.setProperty("--c", l.c);
      b.setAttribute("aria-pressed", String(filter === l.id));
      b.innerHTML = (l.c ? '<span class="dot"></span>' : "") + l.name;
      f.appendChild(b);
    });

    // tasks
    // Daily tasks stay on the list all day (ticked or not); one-time tasks leave once ticked.
    const liveOnce = x => !x.done || leaving.has(x.id);
    if (cal) { renderCal(); return; }
    const ul = $("list");
    ul.innerHTML = "";
    if (view === "projects") { renderProjects(ul); return; }
    let shown;
    if (view === "done") shown = onceAll.filter(x => x.done);
    else shown = tasks.filter(x => isDaily(x) || (liveOnce(x) && (view === "todo" || isToday(x))));
    if (filter !== "all") shown = shown.filter(x => x.list === filter);
    if (view === "done") shown.sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
    else shown.sort((a, b) => (isDaily(b) - isDaily(a)) || (a.due || "9999").localeCompare(b.due || "9999") || a.createdAt - b.createdAt);

    if (!shown.length) { ul.appendChild(emptyState(open.length)); }
    else {
      let lastGroup = null;
      shown.forEach(x => {
        if (view === "todo" || view === "today") {
          // Agenda: one heading per date that actually has tasks.
          const g = isDaily(x) ? "Every day" : view === "today" ? "Just today" : !x.due ? "Someday" : x.due < t ? "Overdue" : dateHeading(x.due);
          if (g !== lastGroup) { const li = document.createElement("li"); li.className = "group-label"; li.textContent = g; ul.appendChild(li); lastGroup = g; }
        }
        ul.appendChild(taskEl(x));
      });
    }

    const clear = document.createElement("button");
    if (view === "done" && clearable) {
      clear.className = "clear" + (armedClear ? " armed" : "");
      clear.id = "clearDone";
      clear.textContent = armedClear ? `Tap again to clear ${clearable}` : `Clear ${clearable} done`;
      ul.appendChild(clear);
    }
  }

  function taskEl(x) {
    const l = listById[x.list] || LISTS[0];
    const li = document.createElement("li");
    const done = doneNow(x), proj = projectOf(x);
    li.className = "task" + (done ? " done" : "") + (leaving.has(x.id) && mode !== "cal" && view !== "done" && view !== "projects" ? " leaving" : "");
    li.dataset.id = x.id;
    li.style.setProperty("--c", l.c);
    let extra = "";
    if (isDaily(x)) {
      const s = streakOf(x);
      extra = `<span class="repeat">Every day</span>${s > 1 ? `<span class="streak">${s}-day streak</span>` : ""}`;
    } else {
      const due = dueInfo(x.due);
      // The agenda heading already names the day; only flag overdue there.
      if (due && !((view === "todo" || mode === "cal") && due.cls !== "late")) extra = `<span class="due ${done ? "" : due.cls}">${due.text}</span>`;
    }
    li.innerHTML = `
      <button class="check" data-act="toggle" aria-label="${done ? "Mark not done" : "Mark done"}"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      <div class="body"><span class="title"></span><span class="meta">${proj && (mode === "cal" || view !== "projects") ? '<span class="proj"></span>' : `<span class="lst">${l.name}</span>`}${extra}</span></div>
      <button class="del${armedDelete === x.id ? " armed" : ""}" data-act="del" aria-label="Delete task">${armedDelete === x.id ? "Delete" : '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'}</button>`;
    li.querySelector(".title").textContent = x.title;
    if (proj && (mode === "cal" || view !== "projects")) li.querySelector(".proj").textContent = proj.title + " ›";
    return li;
  }

  // ---------- calendar ----------
  function renderCal() {
    const t = todayStr();
    const y = calMonth.getFullYear(), m = calMonth.getMonth();
    $("calTitle").textContent = calMonth.toLocaleDateString(undefined, y === new Date().getFullYear() ? { month: "long" } : { month: "short", year: "numeric" });
    const dow = $("calDow");
    if (!dow.childElementCount) {
      // Monday-first week; labels from the locale.
      for (let i = 0; i < 7; i++) { const s = document.createElement("span"); s.textContent = new Date(2024, 0, 1 + i).toLocaleDateString(undefined, { weekday: "short" }).slice(0, 3); dow.appendChild(s); }
    }
    const once = tasks.filter(x => !isDaily(x) && x.due && (filter === "all" || x.list === filter));
    const byDay = {};
    once.forEach(x => (byDay[x.due] = byDay[x.due] || []).push(x));
    const first = new Date(y, m, 1), start = addDays(first, -((first.getDay() + 6) % 7));
    const weeks = Math.ceil(((first.getDay() + 6) % 7 + new Date(y, m + 1, 0).getDate()) / 7);
    const grid = $("calGrid"); grid.innerHTML = "";
    for (let i = 0; i < weeks * 7; i++) {
      const d = addDays(start, i), s = ymd(d), items = (byDay[s] || []).sort((a, b) => a.done - b.done);
      const b = document.createElement("button");
      b.type = "button"; b.dataset.date = s;
      b.className = "cell" + (d.getMonth() !== m ? " out" : "") + (s === t ? " today" : "");
      b.setAttribute("aria-pressed", String(s === selDate));
      const open = items.filter(x => !x.done).length;
      b.setAttribute("aria-label", d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" }) + (items.length ? `, ${open} open, ${items.length - open} done` : ""));
      const dots = items.slice(0, 3).map(x => `<i class="${x.done ? "done" : s < t ? "late" : ""}" style="--c:${(listById[x.list] || LISTS[0]).c}"></i>`).join("") + (items.length > 3 ? `<b>+${items.length - 3}</b>` : "");
      b.innerHTML = `<span class="n">${d.getDate()}</span><span class="dots">${dots}</span>`;
      grid.appendChild(b);
    }
    // Selected day's tasks
    const sd = parseYmd(selDate);
    const label = sd.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
    $("calDayTitle").textContent = selDate === t ? "Today · " + label : label;
    $("calAdd").textContent = `+ Add to ${sd.toLocaleDateString(undefined, { weekday: "short" })} ${sd.getDate()}`;
    const ul = $("dayList"); ul.innerHTML = "";
    const daily = selDate === t ? tasks.filter(x => isDaily(x) && (filter === "all" || x.list === filter)) : [];
    const dayItems = (byDay[selDate] || []).slice().sort((a, b) => a.done - b.done || a.createdAt - b.createdAt);
    const group = txt => { const li = document.createElement("li"); li.className = "group-label"; li.textContent = txt; ul.appendChild(li); };
    if (daily.length) { group("Every day"); daily.forEach(x => ul.appendChild(taskEl(x))); }
    if (dayItems.length) { if (daily.length) group("This day"); dayItems.forEach(x => ul.appendChild(taskEl(x))); }
    if (!daily.length && !dayItems.length) {
      const li = document.createElement("li"); li.className = "empty";
      li.innerHTML = `<p>Nothing planned for this day. Tap <b>+ Add</b> to plan something.</p>`;
      ul.appendChild(li);
    }
  }

  function renderProjects(ul) {
    const list = projects.filter(p => filter === "all" || p.list === filter).sort((a, b) => a.createdAt - b.createdAt);
    if (!list.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.innerHTML = `<div class="blob"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h6"/></svg></div><h2>No projects yet</h2><p>A project is one big goal split into steps, each on its own day. Tap + and choose Project, or try an example:</p><div class="ideas"><button class="chip" data-example="movie">+ Movie: pre-production, production, post-production</button></div>`;
      ul.appendChild(li);
      return;
    }
    list.forEach(p => {
      const l = listById[p.list] || LISTS[0];
      const steps = stepsOf(p), done = steps.filter(s => s.done).length;
      const next = steps.find(s => !s.done), nd = next && dueInfo(next.due);
      const li = document.createElement("li");
      li.className = "project"; li.dataset.pid = p.id; li.style.setProperty("--c", l.c);
      const armed = armedDelete === "p:" + p.id;
      li.innerHTML = `
        <div class="p-head"><div><strong class="p-title"></strong><span class="p-sub"></span></div>
        <button class="p-del${armed ? " armed" : ""}" data-pact="del" aria-label="Delete project">${armed ? "Delete all" : '<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'}</button></div>
        <div class="p-bar" role="img" aria-label="${done} of ${steps.length} steps done"><span style="width:${steps.length ? (done / steps.length) * 100 : 0}%"></span></div>
        <ul class="list p-steps"></ul>
        <button class="chip add-step" data-pact="add">+ Add step</button>`;
      li.querySelector(".p-title").textContent = p.title;
      const sub = li.querySelector(".p-sub");
      if (steps.length && done === steps.length) { sub.textContent = `All ${steps.length} steps done · project complete!`; sub.classList.add("complete"); }
      else sub.textContent = `${l.name} · ${done} of ${steps.length} steps done` + (next ? ` · Next: ${next.title}${nd ? ", " + nd.text : ""}` : "");
      const sl = li.querySelector(".p-steps");
      steps.forEach(s => sl.appendChild(taskEl(s)));
      ul.appendChild(li);
    });
  }

  function emptyState(openCount) {
    const li = document.createElement("li");
    li.className = "empty";
    const msg = view === "done"
      ? ["Nothing ticked off yet", "Tap the circle next to a task when you finish it."]
      : view === "today" && openCount
      ? ["Today is wide open", "Give a task a date of today and it shows up here."]
      :["All clear!", "Tap the + button to add a task, or start with one of these:"];
    li.innerHTML = `<div class="blob"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h2></h2><p></p>`;
    li.querySelector("h2").textContent = msg[0];
    li.querySelector("p").textContent = msg[1];
    if (view === "todo" || (view === "today" && !openCount)) {
      const ideas = document.createElement("div"); ideas.className = "ideas";
      IDEAS.filter(i => !tasks.some(x => x.title === i.t)).forEach(i => { const b = document.createElement("button"); b.className = "chip"; b.dataset.idea = i.t; b.dataset.repeat = i.r; b.textContent = (i.r === "daily" ? "↻ " : "+ ") + i.t; ideas.appendChild(b); });
      li.appendChild(ideas);
    }
    return li;
  }

  // ---------- actions ----------
  function makeTask(title, list, due, repeat, parent) {
    const task = repeat === "daily"
      ? { id: uid(), title: title.trim().slice(0, 140), list, repeat: "daily", days: [], createdAt: Date.now() }
      : { id: uid(), title: title.trim().slice(0, 140), list, repeat: "once", due: due || null, done: false, doneAt: null, createdAt: Date.now() };
    if (parent) task.parent = parent;
    tasks.push(task);
    return task;
  }
  function addTask(title, list, due, repeat, parent) {
    const task = makeTask(title, list, due, repeat, parent);
    render();
    persist(task);
  }
  function createProject(title, list, steps) {
    const p = { id: uid(), kind: "project", title: title.trim().slice(0, 140), list, createdAt: Date.now() };
    projects.push(p);
    const made = steps.map((s, i) => { const t = makeTask(s.title, list, s.due, "once", p.id); t.createdAt += i; return t; });
    render();
    persist(p);
    made.forEach(t => persist(t));
  }
  function removeProject(pid) {
    const p = projects.find(x => x.id === pid); if (!p) return;
    const steps = tasks.filter(t => t.parent === pid);
    projects = projects.filter(x => x !== p);
    tasks = tasks.filter(t => t.parent !== pid);
    armedDelete = null;
    render();
    persist(p, true); steps.forEach(t => persist(t, true));
    showToast("Project deleted", () => { projects.push(p); tasks.push(...steps); render(); persist(p); steps.forEach(t => persist(t)); });
  }
  function celebrate(originEl, quiet) {
    const r = originEl.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2);
    const finished = tasks.filter(doneToday).length, left = tasks.filter(x => !doneNow(x) && isToday(x)).length;
    if (!quiet && left === 0 && finished > 1) setTimeout(() => bigBurst(), 300);
  }
  function toggle(id, originEl) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    if (isDaily(t)) {
      const d = todayStr(), was = t.days || [];
      t.days = was.includes(d) ? was.filter(x => x !== d) : [...was, d].sort().slice(-400);
      if (t.days.includes(d)) {
        const s = streakOf(t);
        showToast(s > 1 ? `${s} days in a row!` : CHEERS[Math.floor(Math.random() * CHEERS.length)], () => { t.days = was; render(); persist(t); });
        celebrate(originEl);
      }
      render();
      persist(t);
      return;
    }
    t.done = !t.done;
    t.doneAt = t.done ? Date.now() : null;
    if (t.done) {
      leaving.add(id);
      const p = projectOf(t), finishedProject = p && stepsOf(p).every(s => s.done);
      showToast(finishedProject ? `"${p.title}" is complete!` : CHEERS[Math.floor(Math.random() * CHEERS.length)], () => { t.done = false; t.doneAt = null; leaving.delete(id); render(); persist(t); });
      setTimeout(() => { leaving.delete(id); render(); }, 650);
      celebrate(originEl, finishedProject);
      if (finishedProject) setTimeout(() => { spawn(innerWidth * .3, innerHeight * .35, 60, 11); spawn(innerWidth * .7, innerHeight * .35, 60, 11); }, 250);
    }
    render();
    persist(t);
  }
  function remove(id) {
    const t = tasks.find(x => x.id === id);
    tasks = tasks.filter(x => x.id !== id);
    armedDelete = null;
    render();
    persist(t, true);
    showToast("Task deleted", () => { tasks.push(t); render(); persist(t); });
  }

  // ---------- events ----------
  document.querySelector(".tabs").addEventListener("click", e => {
    const b = e.target.closest(".tab"); if (!b) return;
    view = b.dataset.view; armedClear = false; armedDelete = null;
    try { localStorage.setItem("tickle-view", view); } catch (err) {}
    render();
  });
  $("filters").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    filter = b.dataset.filter; render();
  });
  document.querySelector(".mode").addEventListener("click", e => {
    const b = e.target.closest("[data-mode]"); if (!b) return;
    mode = b.dataset.mode; armedDelete = null;
    try { localStorage.setItem("tickle-mode", mode); } catch (err) {}
    render();
  });
  $("calPrev").addEventListener("click", () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); render(); });
  $("calNext").addEventListener("click", () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); render(); });
  $("calToday").addEventListener("click", () => { selDate = todayStr(); const n = new Date(); calMonth = new Date(n.getFullYear(), n.getMonth(), 1); render(); });
  $("calGrid").addEventListener("click", e => {
    const c = e.target.closest("[data-date]"); if (!c) return;
    selDate = c.dataset.date;
    const d = parseYmd(selDate);
    if (d.getMonth() !== calMonth.getMonth()) calMonth = new Date(d.getFullYear(), d.getMonth(), 1);
    render();
  });
  $("calAdd").addEventListener("click", () => { draft.date = selDate; openSheet("date"); });
  $("dayList").addEventListener("click", e => onListClick(e));
  $("list").addEventListener("click", e => onListClick(e));
  function onListClick(e) {
    const idea = e.target.closest("[data-idea]");
    if (idea) { addTask(idea.dataset.idea, "personal", todayStr(), idea.dataset.repeat); return; }
    if (e.target.closest("[data-example]")) {
      const day = n => ymd(addDays(new Date(), n));
      createProject("Movie", "work", [
        { title: "Pre-production", due: day(0) }, { title: "Production", due: day(1) }, { title: "Post-production", due: day(2) },
      ]);
      return;
    }
    const pbtn = e.target.closest("[data-pact]");
    if (pbtn) {
      const pid = pbtn.closest(".project").dataset.pid;
      if (pbtn.dataset.pact === "add") openSheet(undefined, pid);
      else if (armedDelete === "p:" + pid) removeProject(pid);
      else { armedDelete = "p:" + pid; render(); setTimeout(() => { if (armedDelete === "p:" + pid) { armedDelete = null; render(); } }, 3000); }
      return;
    }
    if (e.target.closest("#clearDone")) {
      if (!armedClear) { armedClear = true; render(); return; }
      // Steps stay with their project; clearing only removes standalone finished tasks.
      const gone = tasks.filter(x => !isDaily(x) && x.done && !projectOf(x));
      tasks = tasks.filter(x => !gone.includes(x)); armedClear = false; render();
      gone.forEach(t => persist(t, true));
      showToast(`Cleared ${gone.length} task${gone.length === 1 ? "" : "s"}`);
      return;
    }
    const btn = e.target.closest("[data-act]"); if (!btn) return;
    const id = btn.closest(".task").dataset.id;
    if (btn.dataset.act === "toggle") toggle(id, btn);
    if (btn.dataset.act === "del") {
      if (armedDelete === id) remove(id);
      else { armedDelete = id; render(); setTimeout(() => { if (armedDelete === id) { armedDelete = null; render(); } }, 3000); }
    }
  }

  // sheet
  function renderPickers() {
    const pl = $("pickList"); pl.innerHTML = "";
    LISTS.forEach(l => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.dataset.list = l.id;
      b.style.setProperty("--c", l.c);
      b.setAttribute("aria-pressed", String(draft.list === l.id));
      b.innerHTML = '<span class="dot"></span>' + l.name;
      pl.appendChild(b);
    });
    $("pickType").querySelectorAll("[data-type]").forEach(b => b.setAttribute("aria-pressed", String(draft.repeat === b.dataset.type)));
    const isProj = draft.repeat === "project", parent = draft.parent && projects.find(p => p.id === draft.parent);
    $("pickWhen").hidden = $("whenLabel").hidden = $("pickWeek").hidden = draft.repeat === "daily" || isProj;
    $("stepsLabel").hidden = $("steps").hidden = $("addStepRow").hidden = !isProj;
    $("pickType").hidden = !!parent;
    $("pickList").hidden = $("listLabel").hidden = !!parent;
    $("stepOf").hidden = !parent;
    if (parent) { $("stepOf").innerHTML = "Step of <b></b>"; $("stepOf").querySelector("b").textContent = parent.title; }
    $("sheetTitle").textContent = parent ? "New step" : isProj ? "New project" : "New task";
    $("addBtn").textContent = parent ? "Add step" : isProj ? "Create project" : "Add task";
    const busy = {};
    tasks.forEach(x => { if (!isDaily(x) && !x.done && x.due) busy[x.due] = (busy[x.due] || 0) + 1; });
    // Normalise quick picks (today/tomorrow/weekend) to a concrete date so the week grid can highlight it.
    if (["today", "tomorrow", "weekend"].includes(draft.when)) { draft.date = whenToDate(draft.when); draft.when = "date"; }
    const wk = $("pickWeek"); wk.innerHTML = "";
    const weekDates = [];
    for (let i = 0; i < 7; i++) {
      const d = addDays(new Date(), i), s = ymd(d);
      weekDates.push(s);
      const b = document.createElement("button");
      b.type = "button"; b.className = "day" + (i === 0 ? " is-today" : ""); b.dataset.date = s;
      b.setAttribute("aria-pressed", String(draft.when === "date" && draft.date === s));
      const n = busy[s] || 0;
      b.setAttribute("aria-label", d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" }) + (n ? `, ${n} task${n === 1 ? "" : "s"} already` : ""));
      b.innerHTML = `<span class="dname">${d.toLocaleDateString(undefined, { weekday: "short" })}</span><span class="dnum">${d.getDate()}</span><span class="dmon">${i === 0 ? "Today" : d.toLocaleDateString(undefined, { month: "short" })}</span><span class="ddots">${"<i></i>".repeat(Math.min(n, 3))}</span>`;
      wk.appendChild(b);
    }
    const laterDate = draft.when === "date" && draft.date && !weekDates.includes(draft.date);
    $("newTitle").placeholder = parent ? "e.g. Production" : isProj ? "Project name, e.g. Movie" : draft.repeat === "daily" ? "e.g. Brush teeth" : "e.g. Create my Fiverr gig";
    $("pickWhen").querySelectorAll("[data-when]").forEach(b => b.setAttribute("aria-pressed", String(draft.when === b.dataset.when)));
    $("pickDateChip").setAttribute("aria-pressed", String(laterDate));
    $("pickDateLabel").textContent = laterDate ? parseYmd(draft.date).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }) : "Later date";
  }
  // Project step rows: name + date, defaulting to consecutive days from today.
  function renderSteps() {
    const box = $("steps"); box.innerHTML = "";
    draft.steps.forEach((s, i) => {
      const row = document.createElement("div");
      row.className = "step-row";
      row.innerHTML = `<span class="step-n">${i + 1}</span><input class="step-name" id="step-name-${i}" data-i="${i}" type="text" maxlength="140" autocomplete="off" placeholder="${["e.g. Pre-production", "e.g. Production", "e.g. Post-production"][i] || "Next step"}"><label class="chip date-chip"><span>${parseYmd(s.due).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" })}</span><input type="date" id="step-date-${i}" data-i="${i}" value="${s.due}" aria-label="Date for step ${i + 1}"></label><button type="button" class="step-x" data-i="${i}" aria-label="Remove step ${i + 1}">×</button>`;
      row.querySelector(".step-name").value = s.title;
      box.appendChild(row);
    });
  }
  function addStepRow() {
    const last = draft.steps[draft.steps.length - 1];
    draft.steps.push({ title: "", due: last ? ymd(addDays(parseYmd(last.due), 1)) : todayStr() });
  }
  $("steps").addEventListener("input", e => { const i = e.target.dataset.i; if (e.target.classList.contains("step-name")) draft.steps[i].title = e.target.value; });
  $("steps").addEventListener("change", e => { const i = e.target.dataset.i; if (e.target.type === "date" && e.target.value) { draft.steps[i].due = e.target.value; renderSteps(); } });
  $("steps").addEventListener("click", e => { const x = e.target.closest(".step-x"); if (x) { draft.steps.splice(+x.dataset.i, 1); renderSteps(); } });
  $("addStepRow").addEventListener("click", () => { addStepRow(); renderSteps(); $("step-name-" + (draft.steps.length - 1)).focus(); });

  function openSheet(when, parent) {
    if (filter !== "all") draft.list = filter;
    draft.parent = parent || null;
    draft.when = typeof when === "string" ? when : view === "today" ? "today" : draft.when;
    if (typeof when === "string" || parent) draft.repeat = "once";
    else if (view === "projects") draft.repeat = "project";
    if (parent) {
      const p = projects.find(x => x.id === parent), steps = stepsOf(p), last = steps[steps.length - 1];
      draft.list = p.list;
      draft.when = "date";
      draft.date = last && last.due && last.due >= todayStr() ? ymd(addDays(parseYmd(last.due), 1)) : todayStr();
    }
    draft.steps = [];
    for (let i = 0; i < 3; i++) addStepRow();
    renderSteps();
    renderPickers();
    $("sheetWrap").hidden = false;
    setTimeout(() => $("newTitle").focus(), 60);
  }
  function closeSheet() { $("sheetWrap").hidden = true; }
  $("fab").addEventListener("click", () => { if (mode === "cal") { draft.date = selDate; openSheet("date"); } else openSheet(); });
  $("planGo").addEventListener("click", () => openSheet(planKind === "month" ? "month" : "today"));
  $("planX").addEventListener("click", () => { try { localStorage.setItem("tickle-plan-" + planKind, todayStr()); } catch (e) {} $("plan").hidden = true; });
  $("scrim").addEventListener("click", closeSheet);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
  $("pickType").addEventListener("click", e => { const b = e.target.closest("[data-type]"); if (b) { draft.repeat = b.dataset.type; renderPickers(); } });
  $("pickList").addEventListener("click", e => { const b = e.target.closest("[data-list]"); if (b) { draft.list = b.dataset.list; renderPickers(); } });
  $("pickWhen").addEventListener("click", e => { const b = e.target.closest("[data-when]"); if (b) { draft.when = b.dataset.when; renderPickers(); } });
  $("pickWeek").addEventListener("click", e => { const b = e.target.closest("[data-date]"); if (b) { draft.when = "date"; draft.date = b.dataset.date; renderPickers(); } });
  $("pickDate").addEventListener("change", e => { if (e.target.value) { draft.when = "date"; draft.date = e.target.value; renderPickers(); } });
  $("newTitle").addEventListener("input", e => { $("addBtn").disabled = !e.target.value.trim(); });
  $("sheet").addEventListener("submit", e => {
    e.preventDefault();
    const v = $("newTitle").value.trim(); if (!v) return;
    if (draft.repeat === "project" && !draft.parent) createProject(v, draft.list, draft.steps.filter(s => s.title.trim()));
    else addTask(v, draft.list, whenToDate(draft.when), draft.repeat, draft.parent);
    $("newTitle").value = ""; $("addBtn").disabled = true;
    closeSheet();
    showToast("Added!");
  });

  // ---------- toast ----------
  let toastTimer;
  function showToast(text, undo) {
    const w = $("toastWrap"); w.innerHTML = "";
    const d = document.createElement("div"); d.className = "toast"; d.setAttribute("role", "status");
    const s = document.createElement("span"); s.textContent = text; d.appendChild(s);
    if (undo) { const b = document.createElement("button"); b.textContent = "Undo"; b.onclick = () => { w.innerHTML = ""; undo(); }; d.appendChild(b); }
    w.appendChild(d);
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { w.innerHTML = ""; }, 3200);
  }

  // ---------- confetti ----------
  const cv = $("confetti"), ctx = cv.getContext("2d");
  let parts = [], raf = null;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function colors() { const cs = getComputedStyle(document.documentElement); return ["--l-personal", "--l-work", "--l-home", "--l-errands", "--sun"].map(v => cs.getPropertyValue(v).trim()); }
  function spawn(x, y, n, speed) {
    if (reduce) return;
    const cols = colors();
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = speed * (0.4 + Math.random());
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - speed * .6, r: 3 + Math.random() * 4, rot: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[i % cols.length], life: 1 });
    }
    if (!raf) { resize(); raf = requestAnimationFrame(tick); }
  }
  const burst = (x, y) => spawn(x, y, 26, 7);
  const bigBurst = () => { spawn(innerWidth * .25, innerHeight * .35, 60, 11); spawn(innerWidth * .75, innerHeight * .35, 60, 11); showToast("Today's list is done!"); };
  function resize() { const dpr = devicePixelRatio || 1; cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 20);
    parts.forEach(p => {
      p.vy += .32; p.vx *= .98; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= .012;
      ctx.save(); ctx.globalAlpha = Math.max(p.life, 0); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c; ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore();
    });
    raf = parts.length ? requestAnimationFrame(tick) : (ctx.clearRect(0, 0, innerWidth, innerHeight), null);
  }
  addEventListener("resize", () => { if (raf) resize(); });

  // ---------- boot ----------
  loadLocal();
  // Links from reminders: #today, #month, #plan-today, #plan-month
  const hash = location.hash.slice(1);
  if (["todo", "today", "projects", "done"].includes(hash)) view = hash;
  if (hash === "month") view = "todo";
  if (hash === "plan-today" || hash === "plan-month") { const w = hash.slice(5); view = w === "today" ? "today" : "todo"; setTimeout(() => openSheet(w), 300); }
  render();
  connectDb();
  // Roll over to a new day while the app stays open.
  let day = todayStr();
  setInterval(() => { if (todayStr() !== day) { day = todayStr(); render(); } }, 60000);
})();
</script>

</body>
</html>
